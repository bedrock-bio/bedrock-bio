version: 2

# Note: the r/ client (CRAN) has no Dependabot ecosystem support and is intentionally omitted.
updates:
  - package-ecosystem: uv
    directory: "/python"
    schedule:
      interval: weekly
    groups:
      uv:
        applies-to: version-updates
        patterns: ["*"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
