name: r-check

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  check:
    name: r-check-${{ matrix.config.os }}-${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      BB_ENV: dev
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: '4.6'}
          - {os: ubuntu-latest,  r: '4.6'}
          - {os: ubuntu-latest,  r: '4.5'}
          - {os: ubuntu-latest,  r: '4.4'}
          - {os: ubuntu-latest,  r: '4.3'}
          - {os: ubuntu-latest,  r: '4.2'}
    steps:
      - name: check-out-repository
        uses: actions/checkout@v5
      - name: install-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - name: install-r-dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - name: check-r-package
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r

  # Stable check for branch protection: succeeds only if every matrix leg did.
  r-check-gate:
    name: r-check-gate
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: verify-checks-passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "r-check matrix did not succeed: ${{ needs.check.result }}"
            exit 1
          fi