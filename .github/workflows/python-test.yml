name: python-test

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python-test-${{ matrix.config.os }}-${{ matrix.config.python }}
    runs-on: ${{ matrix.config.os }}
    env:
      BB_ENV: dev
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   python: "3.14"}
          - {os: windows-latest, python: "3.14"}
          - {os: ubuntu-latest,  python: "3.14"}
          - {os: ubuntu-latest,  python: "3.13"}
          - {os: ubuntu-latest,  python: "3.12"}
          - {os: ubuntu-latest,  python: "3.11"}
    steps:
      - name: check-out-repository
        uses: actions/checkout@v5
      - name: install-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.config.python }}
          working-directory: python
          enable-cache: true
      - name: run-tests
        run: uv run pytest tests/

  # Stable check for branch protection: succeeds only if every matrix leg did.
  python-test-gate:
    name: python-test-gate
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: verify-tests-passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "python-test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi