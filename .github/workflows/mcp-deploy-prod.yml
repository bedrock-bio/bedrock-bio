name: mcp-deploy-prod

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: check-out-repository
        uses: actions/checkout@v5
      - name: install-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: install-dependencies
        run: npm ci
      - name: wrangler-deploy
        run: npx wrangler deploy --var ACCOUNT_ID:"$CLOUDFLARE_ACCOUNT_ID" --var BUCKET_NAME:"$CLOUDFLARE_R2_BUCKET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      - name: smoke-test-health
        run: |
          curl --retry 5 --retry-delay 3 --retry-all-errors -sSf \
            https://mcp.bedrock.bio/health \
            | jq -e '.status == "ok"'
