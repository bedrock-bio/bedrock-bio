name: python-build

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: python-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: check-out-repository
        uses: actions/checkout@v7
      - name: install-uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: python
          enable-cache: true
      - name: build-package
        run: uv build
      - name: smoke-test-wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import bedrock_bio; assert bedrock_bio.__version__"
      - name: smoke-test-sdist
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import bedrock_bio; assert bedrock_bio.__version__"
