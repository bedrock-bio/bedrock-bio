name: python-publish-prod

on:
  release:
    types: [published]

jobs:
  # Gate the release on the client working against the live prod data backend.
  test-prod:
    name: python-test-prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: check-out-repository
        uses: actions/checkout@v5
      - name: install-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          working-directory: python
          enable-cache: true
      - name: run-tests-against-prod
        run: uv run pytest tests/

  publish-prod:
    needs: test-prod
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - name: check-out-repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: install-uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          working-directory: python
      - name: build-package
        run: uv build
      - name: publish-package
        run: uv publish
