name: mcp-deploy-dev

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: check-out-repository
        uses: actions/checkout@v5
      - name: install-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: install-dependencies
        run: npm ci
      - name: wrangler-deploy
        run: npx wrangler deploy --env dev --var ACCOUNT_ID:"$CLOUDFLARE_ACCOUNT_ID" --var R2_BUCKET_NAME:"$R2_BUCKET_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      - name: smoke-test-health
        run: |
          curl --retry 5 --retry-delay 3 --retry-all-errors -sSf \
            https://mcp-dev.bedrock.bio/health \
            | jq -e '.status == "ok"'
