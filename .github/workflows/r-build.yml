name: r-build

on:
  release:
    types: [published]

jobs:
  # Gate the release on R CMD check (which runs the suite) against live prod.
  check-prod:
    name: r-check-prod
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - name: check-out-repository
        uses: actions/checkout@v7.0.1
      - name: install-r
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: install-r-dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - name: check-r-package
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r

  build:
    needs: check-prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: check-out-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install-r
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          use-public-rspm: true
      - name: install-r-dependencies
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          working-directory: r
      - name: build-package
        run: R CMD build r/
      - name: upload-release-asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: bedrockbio_*.tar.gz
